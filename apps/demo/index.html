<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Editor — Testbed</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #0f0f17;
        color: #e0e0e0;
        height: 100vh;
        display: grid;
        grid-template-columns: 1fr 360px;
        grid-template-rows: auto 1fr;
        overflow: hidden;
      }

      header {
        grid-column: 1 / -1;
        background: #1a1a2e;
        padding: 10px 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      header h1 { font-size: 15px; font-weight: 600; }

      #editor-area {
        background: #fff;
        position: relative;
        overflow: hidden;
      }

      editor-wrapper,
      shell-manage,
      shell-create {
        display: block;
        width: 100%;
        height: 100%;
      }
      shell-manage, shell-create { overflow-y: auto; }
      #token-input, #tenant-input {
        width: 100%;
        background: #0f0f17;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 6px;
        color: #a8e6cf;
        font-family: 'Menlo', monospace;
        font-size: 11px;
        padding: 6px 8px;
        outline: none;
      }
      [hidden] { display: none !important; }

      #sidebar {
        background: #14141f;
        border-left: 1px solid rgba(255,255,255,0.08);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .sidebar-section {
        padding: 14px 16px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
      }
      .sidebar-section h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.5;
        margin-bottom: 10px;
      }

      #config-editor {
        width: 100%;
        height: 160px;
        background: #0f0f17;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 6px;
        color: #a8e6cf;
        font-family: 'Menlo', monospace;
        font-size: 11px;
        padding: 8px;
        resize: none;
        outline: none;
      }

      .btn-row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      button.action-btn {
        padding: 7px 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        font-family: inherit;
      }
      #load-btn     { background: #27ae60; color: #fff; flex: 1; }
      #log-data-btn { background: #2980b9; color: #fff; flex: 1; }
      #clear-btn    { background: rgba(255,255,255,0.08); color: #ccc; }

      #log-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 0;
      }
      #log-area h2 { padding: 14px 16px 0; }
      #event-log {
        flex: 1;
        overflow-y: auto;
        background: #0a0a12;
        margin: 12px;
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 6px;
        padding: 10px;
        font-family: 'Menlo', monospace;
        font-size: 10px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-all;
        color: #7ec8e3;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Content Editor Testbed</h1>
    </header>

    <div id="editor-area">
      <editor-wrapper id="editor"></editor-wrapper>
      <shell-manage id="shell-manage" hidden></shell-manage>
      <shell-create id="shell-create" hidden></shell-create>
    </div>

    <div id="sidebar">
      <div class="sidebar-section">
        <h2>Editor Type</h2>
        <select id="editor-type-select" class="action-btn" style="width: 100%; background: rgba(255,255,255,0.08); color: #e0e0e0;">
          <option value="content">content</option>
          <option value="course">course</option>
          <option value="shell-manage">shell-manage</option>
          <option value="shell-create">shell-create</option>
        </select>
      </div>

      <div class="sidebar-section" id="token-section" hidden>
        <h2>Token (localStorage.token)</h2>
        <input id="token-input" type="password" placeholder="Paste access token" autocomplete="off" />
        <h2 style="margin-top: 12px">Tenant ID (localStorage.tenantId)</h2>
        <input id="tenant-input" type="text" placeholder="Tenant id" autocomplete="off" />
      </div>

      <div class="sidebar-section">
        <h2>Editor Config</h2>
        <textarea id="config-editor" spellcheck="false"></textarea>
        <div class="btn-row">
          <button id="load-btn" class="action-btn">Apply Config</button>
          <button id="clear-btn" class="action-btn">Clear Log</button>
        </div>
        <div class="btn-row">
          <button id="log-data-btn" class="action-btn">Log Current Data</button>
        </div>
      </div>

      <div id="log-area">
        <h2>Events</h2>
        <pre id="event-log">Waiting for editor events…</pre>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
